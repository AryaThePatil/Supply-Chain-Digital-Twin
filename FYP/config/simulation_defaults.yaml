# Simulation Default Configuration
# All hardcoded values extracted to this central config file

weather:
  defaults:
    humidity: 50.0
    temperature: 25.0
  
network:
  road_quality_penalties:
    dirt: 10.0          # Huge penalty for dirt roads
    unpaved: 5.0        # Significant penalty for unpaved
    primary: 0.0        # No penalty (preferred)
    secondary: 1.0      # Small penalty
    tertiary: 2.0       # Medium penalty
    residential: 3.0    # Higher penalty for residential/unknown
  min_speed_kmh: 1.0    # Minimum to avoid division by zero
  
  # Routing thresholds
  reroute_improvement_threshold: 0.10  # Minimum 10% improvement to reroute
  single_lane_penalty: 1.0             # Additional penalty for single-lane roads
  
entities:
  orange_batch:
    initial_rsl_percent: 100.0
    shelf_life_days: 14
  
  driver:
    initial_fatigue: 0.0
    max_driving_minutes: 240
    break_minutes: 30
    break_required_after_minutes: 180
  
  truck:
    unload_minutes_per_ton: 6
    load_minutes_per_ton: 4
    fuel_capacity_liters: 80
  
  refueling:
    rate_liters_per_minute: 40.0  # Commercial refueling rate
    setup_time_minutes: 0.5        # Time to connect/disconnect hose
    low_fuel_threshold_percent: 20.0  # Trigger refuel warning

simulation:
  default_time_step: 1.0      # minutes
  snapshot_interval: 5        # minutes
  default_speed_multiplier: 10
